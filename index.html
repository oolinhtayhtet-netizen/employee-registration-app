<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Admin - ဝန်ထမ်းမှတ်ပုံတင်စနစ်</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --label-color: #334155;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 15px;
        }

        .form-container {
            max-width: 720px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 35px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--label-color);
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: all 0.25s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        input[readonly] {
            background-color: #e2e8f0;
            color: #64748b;
            cursor: not-allowed;
        }

        input[type="file"] {
            padding: 12px;
            background: var(--input-bg);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 13px;
            color: #475569;
            transition: border-color 0.2s;
        }

        input[type="file"]:hover {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .col {
            flex: 1;
        }

        @media (max-width: 650px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ဝန်ထမ်းအသစ် မှတ်ပုံတင်ရန် Form</h2>
    <form id="regForm" onsubmit="submitForm(event)">
        
        <div class="row">
            <div class="form-group col">
                <label>Employee ID</label>
                <input type="text" id="employeeId" maxlength="6" placeholder="ဥပမာ- 123456" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>

            <div class="form-group col">
                <label>Role</label>
                <select id="role" required>
                    <option value="">Choose Role</option>
                    <option value="leader">Leader</option>
                    <option value="second leader">Second Leader</option>
                    <option value="helper">Helper</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="U Aung Aung" required oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
        </div>

        <div class="form-group">
            <label>Father's Name</label>
            <input type="text" id="fatherName" placeholder="U Ba" required oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
        </div>

        <div class="row">
            <div class="form-group col">
                <label>Date of Birth</label>
                <input type="date" id="dob" required onchange="calculateAge()">
            </div>

            <div class="form-group col">
                <label>Age</label>
                <input type="text" id="age" readonly placeholder="လက်ရှိ အသက်အပိုင်းအခြား">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea id="address" rows="2" placeholder="လိပ်စာအပြည့်အစုံ ရိုက်ထည့်ရန်" required></textarea>
        </div>

        <div class="row">
            <div class="form-group col">
                <label>NRC Number</label>
                <input type="text" id="nrcNumber" placeholder="၁/မကန(နိုင်)123456" required>
            </div>

            <div class="form-group col">
                <label>Phone Number</label>
                <input type="text" id="phoneNumber" value="09-" maxlength="11" required oninput="validatePhone(this)">
            </div>
        </div>

        <div class="form-group">
            <label>Joining Date</label>
            <input type="date" id="joiningDate" readonly>
        </div>

        <div class="form-group">
            <label>Employee Photo</label>
            <input type="file" id="photoFile" accept="image/*" required>
        </div>

        <div class="row">
            <div class="form-group col">
                <label>NRC Front Photo</label>
                <input type="file" id="nrcFrontFile" accept="image/*" required>
            </div>

            <div class="form-group col">
                <label>NRC Back Photo</label>
                <input type="file" id="nrcBackFile" accept="image/*" required>
            </div>
        </div>

        <div class="form-group">
            <label>Remarks</label>
            <textarea id="remarks" rows="2" placeholder="ထပ်မံဖြည့်စွက်ရန် ရှိပါက ရိုက်ထည့်ပါ"></textarea>
        </div>

        <button type="submit">ဒေတာ သိမ်းဆည်းမည်</button>
    </form>
</div>

<script>
    // နေ့စွဲအလိုအလျောက် ဖြည့်ရန် (Joining Date = Today)
    document.getElementById('joiningDate').valueAsDate = new Date();

    // အသက် အလိုအလျောက် တွက်ချက်ခြင်း
    function calculateAge() {
        const dobVal = document.getElementById('dob').value;
        if (!dobVal) return;
        const dobDate = new Date(dobVal);
        const diff = Date.now() - dobDate.getTime();
        const ageDate = new Date(diff);
        const age = Math.abs(ageDate.getUTCFullYear() - 1970);
        document.getElementById('age').value = age + " နှစ်";
    }

    // ဖုန်းနံပါတ် စစ်ဆေးခြင်း (09- ဖြင့်စရန် နှင့် ဂဏန်း ၉ လုံးတိတိဖြစ်ရန်)
    function validatePhone(input) {
        if (!input.value.startsWith("09-")) {
            input.value = "09-";
        }
        let digits = input.value.substring(3).replace(/[^0-9]/g, '');
        if (digits.length > 10) {
            digits = digits.substring(0, 10);
        }
        input.value = "09-" + digits;
    }

    // Base64 သို့ ပြောင်းလဲသည့် Helper Function
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function submitForm(event) {
        event.preventDefault();
        
        const empId = document.getElementById('employeeId').value;
        if (empId.length !== 6) {
            alert("Employee ID သည် ဂဏန်း (၆) လုံးတိတိ ဖြစ်ရပါမည်။");
            return;
        }

        const phone = document.getElementById('phoneNumber').value;
        if (phone.length !== 12) { // 09- (3 chars) + 9 digits = 12 chars
            alert("ဖုန်းနံပါတ် မှားယွင်းနေပါသည်။ (၀၉- ပြီးလျှင် ဂဏန်း ၉ လုံးတိတိ ဖြစ်ရမည်)");
            return;
        }

        const photoFile = document.getElementById('photoFile').files[0];
        const nrcFrontFile = document.getElementById('nrcFrontFile').files[0];
        const nrcBackFile = document.getElementById('nrcBackFile').files[0];

        const formData = {
            employeeId: empId,
            fullName: document.getElementById('fullName').value,
            fatherName: document.getElementById('fatherName').value,
            dob: document.getElementById('dob').value,
            age: document.getElementById('age').value,
            address: document.getElementById('address').value,
            nrcNumber: document.getElementById('nrcNumber').value,
            role: document.getElementById('role').value,
            phoneNumber: phone,
            joiningDate: document.getElementById('joiningDate').value,
            photoBase64: await getBase64(photoFile),
            nrcFrontBase64: await getBase64(nrcFrontFile),
            nrcBackBase64: await getBase64(nrcBackFile),
            remarks: document.getElementById('remarks').value
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlozmzhcFNZhAMqgS7aP9s8ri8__C8AC580G41fRqSCy55OGG657ddawnlBm1xtHJF/exec"; // Apps Script Deploy URL

        alert("ဒေတာများကို ပို့ဆောင်နေပါပြီ...");

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert(result.message);
            if (result.status === "success") {
                document.getElementById('regForm').reset();
                document.getElementById('joiningDate').valueAsDate = new Date();
                document.getElementById('phoneNumber').value = "09-";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။");
        });
    }
</script>

</body>
</html>
