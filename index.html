<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Admin - ဝန်ထမ်းမှတ်ပုံတင်စနစ်</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .form-container {
            max-width: 700px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            margin: 20px auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
        }

        input[type="file"] {
            padding: 10px;
            background: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ဝန်ထမ်းအသစ် မှတ်ပုံတင်ရန် Form</h2>
    <form id="regForm" onsubmit="submitForm(event)">
        
        <div class="row">
            <div class="form-group col">
                <label>Employee ID (ဂဏန်း ၆ လုံးတိတိ)</label>
                <input type="text" id="employeeId" maxlength="6" placeholder="ဥပမာ- 123456" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <span class="error-msg" id="errId">ဂဏန်း (၆) လုံးသာ ရိုက်ထည့်ပါ။</span>
            </div>

            <div class="form-group col">
                <label>Role (ရာထူး)</label>
                <select id="role" required>
                    <option value="">ရာထူး ရွေးချယ်ပါ</option>
                    <option value="leader">Leader</option>
                    <option value="second leader">Second Leader</option>
                    <option value="helper">Helper</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Full Name (English စာသားသီးသန့်)</label>
            <input type="text" id="fullName" placeholder="U Aung Aung" required oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
        </div>

        <div class="form-group">
            <label>Father's Name (English စာသားသီးသန့်)</label>
            <input type="text" id="fatherName" placeholder="U Ba" required oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
        </div>

        <div class="row">
            <div class="form-group col">
                <label>Date of Birth (မွေးသက္ကရာဇ်)</label>
                <input type="date" id="dob" required onchange="calculateAge()">
            </div>

            <div class="form-group col">
                <label>Age (အသက် - အလိုအလျောက်ပေါ်မည်)</label>
                <input type="text" id="age" readonly placeholder="အသက်">
            </div>
        </div>

        <div class="form-group">
            <label>Address (နေရပ်လိပ်စာ)</label>
            <textarea id="address" rows="2" placeholder="လိပ်စာအပြည့်အစုံ ရိုက်ထည့်ရန်" required></textarea>
        </div>

        <div class="row">
            <div class="form-group col">
                <label>NRC Number (မှတ်ပုံတင်အမှတ်)</label>
                <input type="text" id="nrcNumber" placeholder="12/MaGaTa(N)123456" required>
            </div>

            <div class="form-group col">
                <label>Phone Number (ဖုန်းနံပါတ်)</label>
                <input type="text" id="phoneNumber" value="09-" maxlength="11" required oninput="validatePhone(this)">
            </div>
        </div>

        <div class="form-group">
            <label>Joining Date (အလုပ်စတင်ဝင်သည့်ရက်)</label>
            <input type="date" id="joiningDate" readonly>
        </div>

        <div class="form-group">
            <label>Employee Photo (ယူနီဖောင်းဝတ်ဆင်ထားသော ပုံ)</label>
            <input type="file" id="photoFile" accept="image/*" required>
        </div>

        <div class="row">
            <div class="form-group col">
                <label>NRC Front Photo (ရှေ့မျက်နှာပြင်)</label>
                <input type="file" id="nrcFrontFile" accept="image/*" required>
            </div>

            <div class="form-group col">
                <label>NRC Back Photo (နောက်ကျောဘက်)</label>
                <input type="file" id="nrcBackFile" accept="image/*" required>
            </div>
        </div>

        <div class="form-group">
            <label>Remarks (မှတ်ချက်)</label>
            <textarea id="remarks" rows="2" placeholder="ထပ်မံဖြည့်စွက်ရန် ရှိပါက ရိုက်ထည့်ပါ"></textarea>
        </div>

        <button type="submit">ဒေတာ သိမ်းဆည်းမည်</button>
    </form>
</div>

<script>
    // နေ့စွဲအလိုအလျောက် ဖြည့်ရန် (Joining Date = Today)
    document.getElementById('joiningDate').valueAsDate = new Date();

    // အသက် အလိုအလျောက် တွက်ချက်ခြင်း
    function calculateAge() {
        const dobVal = document.getElementById('dob').value;
        if (!dobVal) return;
        const dobDate = new Date(dobVal);
        const diff = Date.now() - dobDate.getTime();
        const ageDate = new Date(diff);
        const age = Math.abs(ageDate.getUTCFullYear() - 1970);
        document.getElementById('age').value = age + " နှစ်";
    }

    // ဖုန်းနံပါတ် စစ်ဆေးခြင်း (09- ဖြင့်စရန် နှင့် ဂဏန်း ၉ လုံးတိတိဖြစ်ရန်)
    function validatePhone(input) {
        if (!input.value.startsWith("09-")) {
            input.value = "09-";
        }
        let digits = input.value.substring(3).replace(/[^0-9]/g, '');
        if (digits.length > 9) {
            digits = digits.substring(0, 9);
        }
        input.value = "09-" + digits;
    }

    // Base64 သို့ ပြောင်းလဲသည့် Helper Function
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function submitForm(event) {
        event.preventDefault();
        
        const empId = document.getElementById('employeeId').value;
        if (empId.length !== 6) {
            alert("Employee ID သည် ဂဏန်း (၆) လုံးတိတိ ဖြစ်ရပါမည်။");
            return;
        }

        const phone = document.getElementById('phoneNumber').value;
        if (phone.length !== 12) { // 09- (3 chars) + 9 digits = 12 chars
            alert("ဖုန်းနံပါတ် မှားယွင်းနေပါသည်။ (၀၉- ပြီးလျှင် ဂဏန်း ၉ လုံးတိတိ ဖြစ်ရမည်)");
            return;
        }

        const photoFile = document.getElementById('photoFile').files[0];
        const nrcFrontFile = document.getElementById('nrcFrontFile').files[0];
        const nrcBackFile = document.getElementById('nrcBackFile').files[0];

        const formData = {
            employeeId: empId,
            fullName: document.getElementById('fullName').value,
            fatherName: document.getElementById('fatherName').value,
            dob: document.getElementById('dob').value,
            age: document.getElementById('age').value,
            address: document.getElementById('address').value,
            nrcNumber: document.getElementById('nrcNumber').value,
            role: document.getElementById('role').value,
            phoneNumber: phone,
            joiningDate: document.getElementById('joiningDate').value,
            photoBase64: await getBase64(photoFile),
            nrcFrontBase64: await getBase64(nrcFrontFile),
            nrcBackBase64: await getBase64(nrcBackFile),
            remarks: document.getElementById('remarks').value
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAXemFmCr9ubS_RAT5-qtuVre6G-iyppRZpSyi6Ygi9Zr6Z9cPGC358Wp2PTp3EA/exec"; // Apps Script Deploy URL

        alert("ဒေတာများကို ပို့ဆောင်နေပါပြီ...");

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert(result.message);
            if (result.status === "success") {
                document.getElementById('regForm').reset();
                document.getElementById('joiningDate').valueAsDate = new Date();
                document.getElementById('phoneNumber').value = "09-";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။");
        });
    }
</script>

</body>
</html>
