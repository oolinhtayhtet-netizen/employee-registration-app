<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Admin - ဝန်ထမ်းမှတ်ပုံတင်စနစ်</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #f8fafc;
            --focus-ring: rgba(79, 70, 229, 0.15);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 13px 16px;
            box-sizing: border-box;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        input[type="file"] {
            padding: 12px;
            background: var(--input-bg);
            border: 1.5px dashed var(--border);
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        button {
            background-color: var(--primary);
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .col {
            flex: 1;
        }

        /* Responsive Design for Mobile, Tablet, iOS & Laptop */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .form-container {
                padding: 20px;
                border-radius: 12px;
            }
            .row {
                flex-direction: column;
                gap: 0;
            }
            h2 {
                font-size: 22px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ဝန်ထမ်းအသစ် မှတ်ပုံတင်ရန် Form</h2>
    <form id="regForm" onsubmit="submitForm(event)">
        
        <div class="row">
            <div class="form-group col">
                <label>Employee ID</label>
                <input type="text" id="employeeId" maxlength="6" placeholder="ဥပမာ- 123456" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>

            <div class="form-group col">
                <label>Role</label>
                <select id="role" required>
                    <option value="">ရာထူး ရွေးချယ်ပါ</option>
                    <option value="leader">Leader</option>
                    <option value="second leader">Second Leader</option>
                    <option value="helper">Helper</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="U Aung Aung" required oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
        </div>

        <div class="form-group">
            <label>Father's Name</label>
            <input type="text" id="fatherName" placeholder="U Ba" required oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')">
        </div>

        <div class="row">
            <div class="form-group col">
                <label>Date of Birth</label>
                <input type="date" id="dob" required onchange="calculateAge()">
            </div>

            <div class="form-group col">
                <label>Age</label>
                <input type="text" id="age" readonly placeholder="အသက် (အလိုအလျောက်ပေါ်မည်)">
            </div>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea id="address" rows="2" placeholder="လိပ်စာအပြည့်အစုံ ရိုက်ထည့်ရန်" required></textarea>
        </div>

        <div class="row">
            <div class="form-group col">
                <label>NRC Number</label>
                <input type="text" id="nrcNumber" placeholder="12/MaGaTa(N)123456" required>
            </div>

            <div class="form-group col">
                <label>Phone Number</label>
                <input type="text" id="phoneNumber" value="09-" maxlength="11" required oninput="validatePhone(this)" placeholder="09-XXXXXXXXX">
            </div>
        </div>

        <div class="form-group">
            <label>Joining Date</label>
            <input type="date" id="joiningDate" readonly>
        </div>

        <div class="form-group">
            <label>Employee Photo</label>
            <input type="file" id="photoFile" accept="image/*" required>
        </div>

        <div class="row">
            <div class="form-group col">
                <label>NRC Front Photo</label>
                <input type="file" id="nrcFrontFile" accept="image/*" required>
            </div>

            <div class="form-group col">
                <label>NRC Back Photo</label>
                <input type="file" id="nrcBackFile" accept="image/*" required>
            </div>
        </div>

        <div class="form-group">
            <label>Remarks</label>
            <textarea id="remarks" rows="2" placeholder="ထပ်မံဖြည့်စွက်ရန် ရှိပါက ရိုက်ထည့်ပါ"></textarea>
        </div>

        <button type="submit">ဒေတာ သိမ်းဆည်းမည်</button>
    </form>
</div>

<script>
    // နေ့စွဲအလိုအလျောက် ဖြည့်ရန် (Joining Date = Today)
    document.getElementById('joiningDate').valueAsDate = new Date();

    // အသက် အလိုအလျောက် တွက်ချက်ခြင်း
    function calculateAge() {
        const dobVal = document.getElementById('dob').value;
        if (!dobVal) return;
        const dobDate = new Date(dobVal);
        const diff = Date.now() - dobDate.getTime();
        const ageDate = new Date(diff);
        const age = Math.abs(ageDate.getUTCFullYear() - 1970);
        document.getElementById('age').value = age + " နှစ်";
    }

    // ဖုန်းနံပါတ် စစ်ဆေးခြင်း (09- ဖြင့်စရန်၊ English ဂဏန်းသီးသန့်ဖြစ်ရန်နှင့် စုစုပေါင်း ၁၁ လုံးဖြစ်ရန်)
    function validatePhone(input) {
        if (!input.value.startsWith("09-")) {
            input.value = "09-";
        }
        // 09- နောက်မှပါလာမည့် စာသားများကို English ဂဏန်း (0-9) သာ လက်ခံရန် စစ်ထုတ်ခြင်း
        let digits = input.value.substring(3).replace(/[^0-9]/g, '');
        if (digits.length > 9) {
            digits = digits.substring(0, 9);
        }
        input.value = "09-" + digits;
    }

    // Base64 သို့ ပြောင်းလဲသည့် Helper Function
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function submitForm(event) {
        event.preventDefault();
        
        const empId = document.getElementById('employeeId').value;
        if (empId.length !== 6) {
            alert("Employee ID သည် ဂဏန်း (၆) လုံးတိတိ ဖြစ်ရပါမည်။");
            return;
        }

        const phone = document.getElementById('phoneNumber').value;
        if (phone.length !== 11) { // 09- (2 chars) + 9 digits = 11 chars total
            alert("ဖုန်းနံပါတ် မှားယွင်းနေပါသည်။ (၀၉- အပါအဝင် စုစုပေါင်း (၁၁) လုံးတိတိ ဖြစ်ရပါမည်။)");
            return;
        }

        const photoFile = document.getElementById('photoFile').files[0];
        const nrcFrontFile = document.getElementById('nrcFrontFile').files[0];
        const nrcBackFile = document.getElementById('nrcBackFile').files[0];

        const formData = {
            employeeId: empId,
            fullName: document.getElementById('fullName').value,
            fatherName: document.getElementById('fatherName').value,
            dob: document.getElementById('dob').value,
            age: document.getElementById('age').value,
            address: document.getElementById('address').value,
            nrcNumber: document.getElementById('nrcNumber').value,
            role: document.getElementById('role').value,
            phoneNumber: phone,
            joiningDate: document.getElementById('joiningDate').value,
            photoBase64: await getBase64(photoFile),
            nrcFrontBase64: await getBase64(nrcFrontFile),
            nrcBackBase64: await getBase64(nrcBackFile),
            remarks: document.getElementById('remarks').value
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxU6RiE8NtTLdfdhLk2OPiXA9sM-Y7onJPuv0aw71P80r32p04rZMfknRfL-MEPFao/exec"; // Apps Script Deploy URL

        alert("ဒေတာများကို ပို့ဆောင်နေပါပြီ...");

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert(result.message);
            if (result.status === "success") {
                document.getElementById('regForm').reset();
                document.getElementById('joiningDate').valueAsDate = new Date();
                document.getElementById('phoneNumber').value = "09-";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။");
        });
    }
</script>

</body>
</html>
